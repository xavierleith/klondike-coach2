aste.pop();else if(sel.type==='foundation')found[sel.s].pop();else tabs[sel.c].splice(sel.r);return a}function flip(ci){let x=tabs[ci].at(-1);if(x&&!x.up){x.up=true;score+=5;return true}return false}function select(src){sel=same(sel,src)?null:src;render()}function moveCol(ci,src=sel){if(!src||!canCol(src,ci))return false;sel=src;save();let old=sel.type==='tab'?sel.c:null,fw=sel.type==='waste',a=remove();tabs[ci].push(...a);moves++;if(fw)score+=5;let exposed=old!==null&&flip(old);sel=null;render();say(exposed?'Excellent — you exposed a hidden card. That is usually your best priority.':'Legal move. Keep looking for hidden-card access or useful empty columns.');return true}function moveFound(s,src=sel){if(!src||!canFound(src,s))return false;sel=src;save();let old=sel.type==='tab'?sel.c:null,c=remove()[0];found[s].push(c);moves++;score+=10;let exposed=old!==null&&flip(old);sel=null;render();say(exposed?'Strong foundation move — it also exposed a hidden card.':'Foundation progress. Be cautious about sending high cards home too early.');return true}function legal(){let out=[];for(let c=0;c<7;c++){let col=tabs[c];for(let r=0;r<col.length;r++){if(!col[r].up)continue;let src={type:'tab',c,r};for(let d=0;d<7;d++)if(canCol(src,d))out.push({src,kind:'col',d,p:r>0&&!col[r-1].up?100:10});for(const s of S)if(canFound(src,s))out.push({src,kind:'found',s,p:col[r].r<=2?70:20})}}if(waste.length){let src={type:'waste'};for(let d=0;d<7;d++)if(canCol(src,d))out.push({src,kind:'col',d,p:50});for(const s of S)if(canFound(src,s))out.push({src,kind:'found',s,p:60})}return out.sort((a,b)=>b.p-a.p)}function clearHints(){hintStep=0;document.querySelectorAll('.hintsource,.good,.legal').forEach(x=>x.classList.remove('hintsource','good','legal'))}function srcEl(src){if(src.type==='waste')return $('#waste .card');if(src.type==='foundation')return document.querySelector('.foundation[data-suit="'+src.s+'"] .card');let c=document.querySelector('.col[data-col="'+src.c+'"]');return c?c.children[src.r]:null}function bindDrag(el,src){let id,sx,sy,g,ox,oy;el.addEventListener('pointerdown',e=>{id=e.pointerId;sx=e.clientX;sy=e.clientY;let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;try{el.setPointerCapture(id)}catch(_){}});el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;if(!g&&Math.hypot(e.clientX-sx,e.clientY-sy)>5){e.preventDefault();sel=src;g=document.createElement('div');g.className='dragghost';selected().forEach((c,i)=>{let n=card(c);n.style.top=i*fg()+'px';g.appendChild(n)});document.body.appendChild(g)}if(g){e.preventDefault();g.style.left=e.clientX-ox+'px';g.style.top=e.clientY-oy+'px'}},{passive:false});el.addEventListener('pointerup',e=>{if(e.pointerId!==id)return;if(!g){id=null;return}e.preventDefault();g.style.display='none';let t=document.elementFromPoint(e.clientX,e.clientY),co=t?.closest('.col'),fo=t?.closest('.foundation');g.remove();g=null;id=null;if(co&&canCol(src,+co.dataset.col))moveCol(+co.dataset.col,src);else if(fo&&canFound(src,fo.dataset.suit))moveFound(fo.dataset.suit,src);else{sel=null;render()}},{passive:false})}function render(){clearHints();$('#score').textContent=score;$('#moves').textContent=moves;$('#stockInfo').textContent=stock.length+' stock • '+waste.length+' waste';$('#stock').innerHTML=stock.length?'<span class="stockback"></span>':waste.length?'↻':'';let W=$('#waste');W.innerHTML='';if(waste.length){let src={type:'waste'},e=card(waste.at(-1),same(sel,src));e.onclick=()=>select(src);bindDrag(e,src);W.appendChild(e)}let F=$('#found');F.innerHTML='';S.forEach(s=>{let p=document.createElement('div');p.className='pile foundation';p.dataset.suit=s;let a=found[s];if(a.length){let src={type:'foundation',s},e=card(a.at(-1),same(sel,src));e.onclick=ev=>{ev.stopPropagation();if(sel&&!same(sel,src)&&canFound(sel,s))moveFound(s);else select(src)};bindDrag(e,src);p.appendChild(e)}p.onclick=()=>{if(sel)moveFound(s)};F.appendChild(p)});let C=$('#cols');C.innerHTML='';tabs.forEach((col,ci)=>{let ce=document.createElement('div');ce.className='col';ce.dataset.col=ci;ce.onclick=()=>{if(sel)moveCol(ci)};let y=0;col.forEach((c,ri)=>{let e=card(c,same(sel,{type:'tab',c:ci,r:ri}));e.style.top=y+'px';e.style.zIndex=ri+1;if(c.up){let src={type:'tab',c:ci,r:ri};e.onclick=ev=>{ev.stopPropagation();if(sel&&!same(sel,src)&&canCol(sel,ci))moveCol(ci);else select(src)};e.ondblclick=()=>{if(canFound(src,c.s))moveFound(c.s,src)};bindDrag(e,src)}else e.disabled=true;ce.appendChild(e);y+=c.up?fg():bg()});C.appendChild(ce)});let h=S.reduce((n,s)=>n+found[s].length,0);$('#home').textContent=h+'/52';if(h===52){clearInterval(timer);$('#winMeta').textContent='Score '+score+' • '+moves+' moves • '+$('#time').textContent;$('#modal').classList.add('show')}}function draw(){clearHints();sel=null;if(stock.length){save();for(let i=0,n=Math.min(3,stock.length);i<n;i++){let c=stock.pop();c.up=true;waste.push(c)}moves++;render();say('You drew 3. Watch which waste cards become reachable.')}else if(waste.length){save();stock=waste.reverse();stock.forEach(c=>c.up=false);waste=[];moves++;render();say('Stock recycled. Compare what becomes reachable on this pass.')}}$('#stock').onclick=draw;$('#new').onclick=newDeal;$('#restart').onclick=()=>{if(initial){restore(cp(initial));hist=[];start=Date.now();render();say('Same deal restarted.')}};$('#undo').onclick=()=>{if(hist.length){restore(hist.pop());render();say('Move undone.')}else say('Nothing to undo yet.')};$('#hint').onclick=()=>{let m=legal()[0];if(!m){say(stock.length?'No productive board move stands out. Try the next Draw 3.':'No productive move is visible.');return}hintStep=Math.min(2,hintStep+1);let se=srcEl(m.src);if(se)se.classList.add('hintsource');let de=m.kind==='col'?document.querySelector('.col[data-col="'+m.d+'"]'):document.querySelector('.foundation[data-suit="'+m.s+'"]');if(hintStep>1&&de)de.classList.add('good');say(hintStep===1?'I marked the card I would consider.':'Blue is the source; green is my preferred destination.')};$('#auto').onclick=()=>{let m=legal().find(x=>x.kind==='found');m?moveFound(m.s,m.src):say('No safe foundation move is available.')};$('#why').onclick=()=>say('Priority order: expose hidden cards, create useful empty columns, improve Draw-3 access, then advance safe low foundation cards.');document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('active',x===b));say(mode==='learn'?'Learn mode gives strategy feedback.':mode==='coach'?'Coach mode keeps feedback lighter.':'')});$('#again').onclick=newDeal;document.querySelectorAll('.toolbar button,.modes button,.why').forEach(b=>{b.addEventListener('pointerdown',()=>b.classList.add('pressed'));['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('pressed'))) });newDeal()})();
